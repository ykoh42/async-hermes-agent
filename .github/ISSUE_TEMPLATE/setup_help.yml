name: "Installation Help"
description: Ask for help installing or importing the async library.
title: "[Install]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is a Python library and does not install the upstream `hermes` CLI, gateway, TUI, or setup wizard. Follow the installation example in this repository's README.

  - type: textarea
    id: command
    attributes:
      label: Installation command
      description: Paste the exact pip or uv command you ran.
      render: shell
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Complete error output
      description: Remove credentials and private paths where necessary.
      render: shell
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Installation source
      options:
        - Git repository
        - Local editable checkout
        - Built wheel
        - Other
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What you already tried
