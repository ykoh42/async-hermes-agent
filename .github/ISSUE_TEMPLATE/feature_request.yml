name: "Feature Request"
description: Propose an improvement to the retained async library.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository intentionally keeps a narrow library surface. New product UIs, messaging adapters, schedulers, and web applications should not be added incidentally. Prefer an existing tool, skill, plugin, or MCP server over expanding the core tool schema.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What retained workflow cannot be implemented correctly today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the public API, behavior, and native-async lifecycle implications.
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Upstream relationship
      description: Does upstream Hermes already implement this? Link the relevant release, commit, issue, or diff.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Agent loop / model transport
        - Tool / MCP / skill
        - Memory / session
        - Trajectory / batch runner
        - Provider / plugin
        - Packaging / developer experience
        - Deliberate restoration of an upstream surface
        - Other
    validations:
      required: true

  - type: textarea
    id: parity
    attributes:
      label: Behavior and verification
      description: How will prompt caching, ordering, cancellation, concurrency, and upstream parity be tested?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this and submit a PR.
