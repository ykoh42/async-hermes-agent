name: "Bug Report"
description: Report incorrect behavior in the retained async library.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and reproduce against the latest release or `main` before submitting. Remove API keys, prompt content, trajectories, and other private data from logs.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small async code example, configuration with secrets removed, and complete traceback.
      render: python
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - Agent loop / model transport
        - Tool execution
        - MCP
        - Skills
        - Memory / sessions
        - Trajectories / batch runner
        - Provider or plugin
        - Packaging / installation
        - Other
    validations:
      required: true

  - type: textarea
    id: concurrency
    attributes:
      label: Async context
      description: Note whether cancellation, timeout, concurrent turns, multiple agents, or an embedding framework is involved.

  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: "0.20.1 or commit SHA"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Additional verification
      description: List focused tests, provider details, or a root-cause analysis if available.

  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This report does not contain a vulnerability or sensitive exploit details; I will use a private Security Advisory for those.
          required: true
