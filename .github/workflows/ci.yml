name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project and test dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra bedrock --extra supermemory --extra hindsight

      - name: Lint
        run: uv run ruff check .

      - name: Audit the native async runtime
        shell: bash
        run: |
          {
            printf '%s\0' run_agent.py model_tools.py mini_swe_runner.py batch_runner.py \
              hermes_state.py hermes_state_portability.py trajectory_compressor.py hermes_constants.py
            rg --files -0 agent tools plugins hermes_cli gateway providers -g '*.py'
          } | xargs -0 -n 50 uv run ruff check --select F821
          {
            printf '%s\0' run_agent.py model_tools.py mini_swe_runner.py batch_runner.py \
              hermes_state.py hermes_state_portability.py trajectory_compressor.py hermes_constants.py
            rg --files -0 agent tools plugins hermes_cli gateway providers -g '*.py'
          } | xargs -0 -n 50 uv run flake8-async --asyncio \
            --enable=ASYNC102,ASYNC103,ASYNC104,ASYNC105,ASYNC200,ASYNC210,ASYNC211,ASYNC212,ASYNC220,ASYNC221,ASYNC222,ASYNC230,ASYNC231,ASYNC232,ASYNC240,ASYNC250,ASYNC251,ASYNC300 \
            --async200-blocking-calls='shutil.which->aiofiles.os.wrap(shutil.which)'
          {
            printf '%s\0' run_agent.py model_tools.py mini_swe_runner.py batch_runner.py \
              hermes_state.py hermes_state_portability.py trajectory_compressor.py hermes_constants.py
            rg --files -0 agent tools plugins hermes_cli gateway providers -g '*.py'
          } | xargs -0 -n 50 uv run flake8-async --asyncio --enable=ASYNC120

      - name: Test
        run: scripts/run_tests.sh -j 4 -- -q -W error::pytest.PytestUnhandledThreadExceptionWarning
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Build distributions
        run: uv build
