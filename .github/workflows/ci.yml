name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project and test dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra bedrock --extra supermemory --extra hindsight --extra honcho --extra mem0

      - name: Lint
        run: uv run ruff check .

      - name: Audit the native async runtime
        shell: bash
        run: |
          {
            printf '%s\0' run_agent.py model_tools.py mini_swe_runner.py batch_runner.py \
              hermes_state.py hermes_state_postgres.py hermes_state_portability.py hermes_state_schema.py trajectory_compressor.py hermes_constants.py
            rg --files -0 agent tools plugins hermes_cli gateway providers -g '*.py'
          } | xargs -0 -n 50 uv run ruff check --select F821
          {
            printf '%s\0' run_agent.py model_tools.py mini_swe_runner.py batch_runner.py \
              hermes_state.py hermes_state_postgres.py hermes_state_portability.py hermes_state_schema.py trajectory_compressor.py hermes_constants.py
            rg --files -0 agent tools plugins hermes_cli gateway providers -g '*.py'
          } | xargs -0 -n 50 uv run flake8-async --asyncio \
            --enable=ASYNC102,ASYNC103,ASYNC104,ASYNC105,ASYNC200,ASYNC210,ASYNC211,ASYNC212,ASYNC220,ASYNC221,ASYNC222,ASYNC230,ASYNC231,ASYNC232,ASYNC240,ASYNC250,ASYNC251,ASYNC300 \
            --async200-blocking-calls='shutil.which->aiofiles.os.wrap(shutil.which)'
          {
            printf '%s\0' run_agent.py model_tools.py mini_swe_runner.py batch_runner.py \
              hermes_state.py hermes_state_postgres.py hermes_state_portability.py hermes_state_schema.py trajectory_compressor.py hermes_constants.py
            rg --files -0 agent tools plugins hermes_cli gateway providers -g '*.py'
          } | xargs -0 -n 50 uv run flake8-async --asyncio --enable=ASYNC120

      - name: Test
        run: scripts/run_tests.sh -j 4 -- -q -W error::pytest.PytestUnhandledThreadExceptionWarning
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Build distributions
        run: uv build

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project and test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Test retained compatibility surface
        run: >-
          scripts/run_tests.sh -j 2
          tests/runtime/test_core.py
          tests/test_hermes_state.py
          tests/tools/test_terminal_exit_semantics.py
          -- -q -W error::pytest.PytestUnhandledThreadExceptionWarning

  postgres:
    name: PostgreSQL ${{ matrix.postgres-version }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            postgres-version: '15'
          - python-version: '3.12'
            postgres-version: '16'
          - python-version: '3.12'
            postgres-version: '17'
          - python-version: '3.13'
            postgres-version: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project and PostgreSQL test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra postgres

      - name: Test PostgreSQL SessionDB against the service
        run: >-
          uv run --locked --python ${{ matrix.python-version }}
          --extra dev --extra postgres pytest -q
          tests/integration/test_postgres_session_db.py
          tests/integration/test_postgres_compaction_e2e.py
          tests/integration/test_postgres_sqlite_differential.py
          tests/integration/test_postgres_production_readiness.py
          -W error::pytest.PytestUnhandledThreadExceptionWarning
        env:
          HERMES_POSTGRES_TEST_DSN: postgresql+psycopg://hermes:hermes@127.0.0.1:5432/hermes
